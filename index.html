<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رصيد</title>
<meta name="description" content="رصيد - دفتر الذمم الذكي: ديون العملاء والموردين بثلاث عملات، أعمار الديون، والتذكير وكشوف الحساب عبر واتساب. تطوير أبو الغيث.">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="رصيد">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a single phone-width ledger column with a fixed bottom tab bar; the navy balance card is the one bold element per screen. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#18212B; --muted:#5A6573; --faint:#7A8492; --line:#E1E5EB; --line-soft:#EEF0F3; --track:#E6E9EE;
  --navy:#1F3A5F; --navy-ink:#1F3A5F; --navy-soft:#E6EDF5; --hero:#1F3A5F; --hero-supplier:#5C3D0E; --on-hero:#FFFFFF; --on-hero-muted:#C9D6E6;
  --gold:#F2C66D; --red:#B42318; --red-soft:#FDECEA; --red-deep:#8F1B12; --green:#1F7A4D; --wa:#146C3C; --wa-ink:#146C3C; --wa-soft:#E3F4EA;
  --amber:#8A5300; --amber-soft:#FDF1DC; --purple:#4B3A8C; --purple-soft:#EEEAFB; --shadow:0 8px 24px rgba(31,58,95,.18);
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif; --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151E; --surface:#162131; --ink:#E6ECF2; --muted:#9DAABB; --faint:#7D8A9A; --line:#24344A; --line-soft:#1D2B3D; --track:#1F2E42;
  --navy:#3567A3; --navy-ink:#9CC0EA; --navy-soft:#1C2E46; --hero:#1E3A60; --hero-supplier:#4A3210; --on-hero:#FFFFFF; --on-hero-muted:#BACBE0;
  --gold:#F2C66D; --red:#FF8B7B; --red-soft:#3A1F1D; --red-deep:#FFB3A8; --green:#6BCB97; --wa:#1E8049; --wa-ink:#7FD9A6; --wa-soft:#163325;
  --amber:#F0B860; --amber-soft:#3A2C14; --purple:#B9A8F5; --purple-soft:#2A2448; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E151E; --surface:#162131; --ink:#E6ECF2; --muted:#9DAABB; --faint:#7D8A9A; --line:#24344A; --line-soft:#1D2B3D; --track:#1F2E42;
  --navy:#3567A3; --navy-ink:#9CC0EA; --navy-soft:#1C2E46; --hero:#1E3A60; --hero-supplier:#4A3210; --on-hero:#FFFFFF; --on-hero-muted:#BACBE0;
  --gold:#F2C66D; --red:#FF8B7B; --red-soft:#3A1F1D; --red-deep:#FFB3A8; --green:#6BCB97; --wa:#1E8049; --wa-ink:#7FD9A6; --wa-soft:#163325;
  --amber:#F0B860; --amber-soft:#3A2C14; --purple:#B9A8F5; --purple-soft:#2A2448; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.3} h2{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.ltr{direction:ltr;unicode-bidi:isolate}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn:focus-visible,.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.seg span:focus-visible{outline:2px solid var(--navy-ink);outline-offset:2px}

/* Hero balance card */
.hero{background:var(--hero);color:var(--on-hero);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero.supplier{background:var(--hero-supplier)}
.hero .lbl{color:var(--on-hero-muted);font-size:13px}
.hero .big{font-family:var(--f-display);font-size:31px;font-weight:600;line-height:1.2}
.hero .big small{font-size:15px;color:var(--on-hero-muted);font-weight:500;margin-inline-start:6px}
.mini{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* Segmented control (radio based) */
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--track);border-radius:12px;padding:4px}
.seg{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;height:40px;border-radius:9px;font-size:14px;cursor:pointer;text-align:center;line-height:1.2;padding:0 4px}
.seg input:checked+span{background:var(--surface);color:var(--navy-ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg input:focus-visible+span{outline:2px solid var(--navy-ink)}
.segs.red .seg input:checked+span{background:var(--red);color:#fff}
.segs.amber .seg input:checked+span{background:var(--amber);color:var(--surface)}
.segs.green .seg input:checked+span{background:var(--green);color:var(--surface)}
.segbtn{border:0;background:transparent;height:40px;border-radius:9px;font-size:14px;cursor:pointer}
.segbtn.on{background:var(--surface);color:var(--navy-ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;display:inline-flex;align-items:center}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
label.chip input{position:absolute;opacity:0;pointer-events:none}
label.chip:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}

/* Rows */
.person{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--navy-soft);color:var(--navy-ink);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.av.sup{border-radius:12px;background:var(--amber-soft);color:var(--amber)}
.av.sm{width:34px;height:34px;font-size:13px}
.act{height:40px;padding:0 12px;border-radius:12px;border:0;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;flex-shrink:0}
.act svg{width:16px;height:16px}
.act.wa{background:var(--wa-soft);color:var(--wa-ink)}
.act.navy{background:var(--navy);color:#fff}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.b-c{background:var(--navy-soft);color:var(--navy-ink)} .b-s{background:var(--amber-soft);color:var(--amber)} .b-b{background:var(--purple-soft);color:var(--purple)}
.bar{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.acc.over{border:1.5px solid #E7A39C}
.minibox{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:6px 10px;font-size:12.5px}

.alert{display:flex;align-items:center;gap:12px;background:var(--red-soft);border-radius:16px;padding:12px 14px;cursor:pointer;border:0;width:100%;text-align:start}
.alert .ic{width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--red)}
.alert b{color:var(--red-deep);font-size:15px}
.warn{display:flex;gap:10px;align-items:center;background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 12px;font-size:14px}

/* Buttons & forms */
.btn{height:52px;border-radius:16px;border:0;background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.wa{background:var(--wa)} .btn.out{background:transparent;border:1.5px solid var(--navy-ink);color:var(--navy-ink)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--navy-ink);font-weight:600;font-size:13.5px;cursor:pointer;padding:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px;color:var(--ink);font-weight:400;width:100%}
.field textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--navy-ink);box-shadow:0 0 0 1px var(--navy-ink)}
.amount{font-family:var(--f-display);font-size:30px!important;height:62px!important;font-weight:600!important}
.sticky-foot{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.sticky-foot>div{max-width:528px;margin:0 auto;display:flex;gap:10px}
.typecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typecard{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.typecard input{position:absolute;opacity:0}
.typecard b{font-size:14px} .typecard span{font-size:10.5px;color:var(--muted);line-height:1.4}
.typecard:has(input:checked){border:2px solid var(--navy-ink);background:var(--navy-soft)}
.typecard.s:has(input:checked){border-color:var(--amber);background:var(--amber-soft)}
.typecard.b:has(input:checked){border-color:var(--purple);background:var(--purple-soft)}
form:has(input[name=type][value=SUPPLIER]:checked) .cust-only{display:none}
form:has(input[name=type][value=CUSTOMER]:checked) .sup-only{display:none}
form:not(:has(input[name=type][value=BOTH]:checked)) .both-only{display:none}
form:has(input[name=kind][value=PAYMENT]:checked) .debt-only{display:none}

/* Tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--navy-ink);font-weight:600}
.fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc(50% - 264px));height:54px;padding:0 20px;border-radius:18px;border:0;background:var(--navy);color:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);cursor:pointer;z-index:4}
.fab svg{width:20px;height:20px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.overlay{align-items:center}}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}

/* Splash & onboarding */
.splash{position:fixed;inset:0;background:#1F3A5F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:40;padding:24px}
.splash h1{font-size:48px;font-weight:700;color:#fff}
.splash .tag{color:#C9D6E6;font-size:17px}
.credit{display:flex;flex-direction:column;align-items:center;gap:6px}
.credit .t{color:#A9BBD1;font-size:13px}
.credit img{width:84px;height:84px;object-fit:contain}
.credit a{color:#F2C66D;font-weight:500;text-decoration:none;font-size:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center;direction:ltr;margin:6px auto 0}
.pinpad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:27px;font-weight:500;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.pinpad button:active{transform:scale(.94)} .pinpad button.ghost{background:transparent;border-color:transparent}
.pinpad button:disabled{opacity:.4}
.pindots{display:flex;gap:14px;justify-content:center;direction:ltr}
.pindots i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint)} .pindots i.on{background:var(--navy);border-color:var(--navy)}
.pinerr{min-height:38px;color:var(--red);font-size:13px;text-align:center;margin:12px 0 6px}
.dark .pinpad button{background:rgba(255,255,255,.08);border-color:transparent;color:#fff} .dark .pinpad button.ghost{background:transparent}
.dark .pindots i{border-color:#C9D6E6} .dark .pindots i.on{background:#F2C66D;border-color:#F2C66D} .dark .pinerr{color:#FFB4A9}
.onb{background:#1F3A5F;color:#fff;border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.onb .field{color:#C9D6E6;text-align:start;width:100%}
.onb .field input{background:#fff;color:#18212B;border:0}
.dev{background:#1F3A5F;color:#fff;border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.dev .pics{display:flex;align-items:center;gap:18px}
.dev .pics .sep{width:1px;height:56px;background:rgba(255,255,255,.22)}
.dev .photo{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #F2C66D}
.dev .logo{width:84px;height:84px;object-fit:contain}
.dev p{margin:0;font-size:14px;line-height:1.85;color:#E4EBF3;max-width:60ch}
.dev a{background:rgba(255,255,255,.12);color:#F2C66D;border-radius:14px;padding:10px 18px;text-decoration:none;font-weight:600}
.footcredit{display:flex;justify-content:center;gap:4px;font-size:11px;color:var(--faint);padding:8px}
.footcredit a{color:var(--navy-ink);font-weight:600;text-decoration:none}

/* Statement preview (paper) */
.paperwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.paper{width:794px;background:#fff;color:#18212B;font-family:var(--f-body);padding:40px 44px;direction:rtl}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper th{background:#1F3A5F;color:#fff;font-weight:600;padding:8px 10px;text-align:start}
.paper td{padding:8px 10px;border-bottom:1px solid #EEF0F3}
.paper tr:nth-child(even) td{background:#FAFBFC}
.paper tfoot td{background:#E6EDF5;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function fifo(list) {
  let paid = list.filter(e => e.kind === 'PAYMENT').reduce((s, e) => s + e.amount, 0);
  const debts = list.filter(e => e.kind === 'DEBT').sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt);
  const out = [];

}
function sideState(es, id, side) {
  const mine = es.filter(e => e.accountId === id && e.side === side);
  const bal = [0,0,0];
  const open = [0,1,2].map(c => { const inC = mine.filter(e => e.currency === c); bal[c] = inC.reduce((s, e) => s + (e.kind === 'DEBT' ? e.amount : -e.amount), 0); return fifo(inC); });
  return { bal, open, has: bal.some(v => v > 0), all: () => open.flat() };
}
const isCust = a => a.type !== 'SUPPLIER', isSup = a => a.type !== 'CUSTOMER';
function summarize(a, es, t = todayISO()) {

  const overdueDues = cOpen.map(o => o.e.due).filter(d => d && d < t);
  const overdueDays = overdueDues.length ? Math.max(...overdueDues.map(d => daysBetween(d, t))) : 0;
  const oldest = cOpen.length ? Math.max(...cOpen.map(o => daysBetween(o.e.date, t))) : 0;

  if (isCust(a)) for (const k in (a.limits || {})) { const lim = a.limits[k], c = +k; if (lim > 0 && c >= 0 && c < 3) { const r = cs.bal[c] / lim; use = Math.max(use ?? 0, r); if (cs.bal[c] > lim) over = true; } }
  const mine = es.filter(e => e.accountId === a.id);
  const nextC = cOpen.map(o => o.e.due).filter(d => d && d >= t).sort()[0] || null;
  const nextS = ss.all().map(o => o.e.due).filter(Boolean).sort()[0] || null;
  return { a, cs, ss, overdueDays, oldest, use, over, nextC, nextS, last: mine.map(e => e.date).sort().pop() || null, net: c => cs.bal[c] - ss.bal[c] };
}
const summaries = () => { const t = todayISO(); return D.accounts.map(a => summarize(a, D.entries, t)); };
function aging(items, t = todayISO()) {
  const b = [0,0,0,0];
  items.forEach(o => { const d = daysBetween(o.e.date, t); b[d <= 30 ? 0 : d <= 60 ? 1 : d <= 90 ? 2 : 3] += o.rem; });
  return b;
}
const overdueAmt = (items, t = todayISO()) => items.filter(o => o.e.due && o.e.due < t).reduce((s, o) => s + o.rem, 0);
function reminderReason(s, t = todayISO()) {
  const st = D.settings;
  if (!isCust(s.a) || !s.cs.has) return null;
  const dues = s.cs.all().map(o => o.e.due).filter(Boolean).sort();
  if (!dues.length) return null;
  const last = s.a.lastReminded;
  if (last === t) return null;
  const firstOver = dues.find(d => d < t);
  if (firstOver) {
    if (last && st.repeat > 0 && daysBetween(last, t) < st.repeat) return null;
    return `متأخر ${daysTxt(daysBetween(firstOver, t))}`;
  }
  const d = daysBetween(t, dues[0]);

  if (d >= 1 && d <= st.remindBefore) return d === 1 ? 'يستحق غداً' : `يستحق بعد ${daysTxt(d)}`;

function reportPaper() {

    if (su.length) html += `<table style="margin-top:12px"><thead><tr><th>المورد</th><th>أقرب استحقاق</th><th>الرصيد</th></tr></thead><tbody>${su.map(x => { const d = x.ss.open[c].map(o => o.e.due).filter(Boolean).sort()[0];
        return `<tr><td>${esc(x.a.name)}</td><td>${d ? fShort(d) : ''}</td><td><b>${money(x.ss.bal[c])}</b></td></tr>`; }).join('')}</tbody></table>`;

  return html + paperFoot() + '</div>';

async function makePdf(paperHtml, filename) {
  if (!window.html2canvas || !window.jspdf) throw new Error('lib');
  const host = document.getElementById('pdfhost'); host.innerHTML = paperHtml;
  const el = host.firstElementChild;
  try { await document.fonts.ready; } catch (e) {}
  const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  host.innerHTML = '';
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
  const pagePx = Math.floor(canvas.width * ph / pw);
  for (let y = 0, i = 0; y < canvas.height; y += pagePx, i++) {
    const h = Math.min(pagePx, canvas.height - y), part = document.createElement('canvas');
    part.width = canvas.width; part.height = h; const g = part.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, part.width, h); g.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
    if (i) pdf.addPage();
    pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, h * pw / canvas.width);
  }
  return new File([pdf.output('blob')], filename.replace(/[\\/:*?"<>|]/g, ' ') + '.pdf', { type: 'application/pdf' });
}
async function sharePdf(file, text) {
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text || undefined }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  try { const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true; } catch (e) { return false; }
}
function showPaper(title, paperHtml, filename, shareText) {
  modal(`<div class="between" style="align-items:center"><h2>${title}</h2><button class="link" data-act="closeModal">إغلاق</button></div>
    <div class="paperwrap"><div style="transform-origin:top right;transform:scale(var(--sc,0.5));width:794px;height:0" id="paperbox">${paperHtml}</div></div>
    <button class="btn" id="pdf-go">${ic('share')} مشاركة / حفظ PDF</button><div class="small muted">على الآيفون: اختر واتساب من قائمة المشاركة ثم العميل.</div>`);
  const box = document.getElementById('paperbox'), wrap = box.parentElement, sc = Math.min(1, (wrap.clientWidth - 2) / 794);
  box.style.setProperty('--sc', sc); box.style.height = (box.firstElementChild.scrollHeight * sc) + 'px';
  document.getElementById('pdf-go').onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = 'جارٍ تجهيز الملف…';
    try { const f = await makePdf(paperHtml, filename); const ok = await sharePdf(f, shareText); if (!ok) toast('المشاركة غير متاحة هنا. افتح التطبيق من رابطه المثبّت.'); }
    catch (e) { toast('تعذّر إنشاء ملف PDF. تحقق من الاتصال لأول مرة ثم أعد المحاولة.'); }
    b.disabled = false; b.innerHTML = ic('share') + ' مشاركة / حفظ PDF';
  };
}

    <button class="btn out" style="border-color:var(--red);color:var(--red)" data-act="pinVerify" data-then="off">إيقاف القفل</button>
    <button class="link" data-act="closeModal">إغلاق</button></div>`);
}
async function pinPress(k) {
  if (pin.busy) return;
  const setting = pin.mode === 'set1' || pin.mode === 'set2';
  if (!setting && PinLock.waitSec() > 0) return;
  const len = setting ? pin.len : PinLock.len;
  if (k === 'del') { pin.buf = pin.buf.slice(0, -1); pinRedraw(); return; }
  if (pin.buf.length >= len) return;
  pin.buf += k; pin.err = ''; pinRedraw();
  if (pin.buf.length < len) return;
  const p = pin.buf; pin.buf = '';
  await new Promise(r => setTimeout(r, 120));
  if (pin.mode === 'set1') { pin = { ...pin, mode: 'set2', first: p }; pinSheet(); return; }
  if (pin.mode === 'set2') {
    if (p === pin.first) { pin.busy = true; await PinLock.set(p); pin = { mode: 'unlock', buf: '', err: '' }; modal(''); render(); toast('تم تفعيل قفل التطبيق'); }
    else { pin = { ...pin, mode: 'set1', first: null, err: 'الرمزان غير متطابقين، أعد المحاولة' }; pinSheet(); }
    return;
  }
  pin.busy = true;
  const ok = await PinLock.check(p);
  pin.busy = false;
  if (!ok) {
    const left = PinLock.triesLeft();
    pin.err = PinLock.waitSec() > 0 ? '' : left >= 1 && left <= 3 ? `رمز غير صحيح · بقيت ${left} محاولات قبل الإيقاف المؤقت` : 'رمز غير صحيح';
    pinRedraw(); return;
  }
  if (pin.mode === 'unlock') { PinLock.unlock(); render(); return; }
  if (pin.then === 'change') { pin = { mode: 'set1', buf: '', err: '', len: PinLock.len }; pinSheet(); return; }
  PinLock.disable(); pin = { mode: 'unlock', buf: '', err: '' }; modal(''); render(); toast('تم إيقاف قفل التطبيق');
}
document.addEventListener('keydown', ev => {
  if (!document.getElementById('pin-box')) return;
  if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); pinPress(ev.key); }
  else if (ev.key === 'Backspace') { ev.preventDefault(); pinPress('del'); }
});

// ================= render =================
function render() {
  const app = document.getElementById('app');
  const v = { splash: vSplash, onboard: vOnboard, home: vHome, account: vAccount, accountEdit: vAccountEdit, entry: vEntry, wa: vWa }[ui.screen] || vHome;
  if (ui.screen !== 'splash' && ui.screen !== 'onboard' && D.store.name && PinLock.locked) {
    // The open screen stays in `ui`, so it comes back as it was after unlocking.
    if (pin.mode !== 'unlock') pin = { mode: 'unlock', buf: '', err: '' };
    if (!document.querySelector('[data-act="pinWipe"],[data-act="pinWipeYes"]')) modal('');
    app.innerHTML = vPinLock(); pinRedraw(); return;
  }
  if (ui.screen !== 'splash' && ui.screen !== 'onboard' && D.store.name && Lic.state().locked) { app.innerHTML = vLock(); return; }
  app.innerHTML = v();
  if (ui.screen === 'entry') updateLimitWarn();
}
function updateLimitWarn() {
  const f = document.getElementById('f-entry'), w = document.getElementById('lim-warn'); if (!f || !w) return;
  const fd = new FormData(f), a = D.accounts.find(x => x.id === (fd.get('accountId') || ui.p.accountId || (ui.p.entryId && D.entries.find(e => e.id === ui.p.entryId)?.accountId)));
  const amt = parseMoney(fd.get('amount')), c = +(fd.get('currency') || 0), side = fd.get('side'), kind = fd.get('kind');
  let msg = null;
  if (a && side === 'CUSTOMER' && kind === 'DEBT' && amt) { const lim = (a.limits || {})[c] || 0;
    if (lim > 0) { const others = D.entries.filter(e => e.accountId === a.id && e.id !== ui.p.entryId); const after = sideState(others, a.id, 'CUSTOMER').bal[c] + amt; if (after > lim) msg = `سيتجاوز الحد الائتماني بـ ${moneyC(after - lim, c)}`; } }
  w.hidden = !msg; if (msg) w.querySelector('span').textContent = msg;
}

// ================= actions =================
const A = {
  pinKey: d => pinPress(d.k),
  pinSettings: () => pinSettings(),
  pinSetup: () => { pin = { mode: 'set1', buf: '', err: '', len: 4 }; pinSheet(); },
  pinLen: d => { pin = { ...pin, len: +d.n, buf: '', err: '' }; pinSheet(); },
  pinTimeout: d => { PinLock.setTimeout(+d.s); pinSettings(); render(); },
  pinVerify: d => { pin = { mode: 'verify', then: d.then, buf: '', err: '' }; pinSheet(); },
  pinForgot: () => modal(`<div class="stack"><h2>نسيت رمز القفل</h2><div class="muted">لا يمكن استعادة الرمز لأنه لا يُحفظ إلا مشفّراً على هذا الجهاز. الحل الوحيد هو حذف بيانات رصيد من هذا الجهاز، ثم استعادة آخر نسخة احتياطية لديك من الإعدادات.</div>
    <button class="btn" style="background:var(--red)" data-act="pinWipe">حذف بيانات هذا الجهاز</button><button class="btn out" data-act="closeModal">إلغاء</button></div>`),
  pinWipe: () => modal(`<div class="stack"><h2>تأكيد الحذف النهائي</h2><div class="muted">ستُحذف جميع الحسابات والحركات والإعدادات وشعار المتجر من هذا الجهاز، ولا يمكن التراجع. حالة الترخيص لا تتأثر.</div>
    <button class="btn" style="background:var(--red)" data-act="pinWipeYes">نعم، احذف كل شيء</button><button class="btn out" data-act="closeModal">إلغاء</button></div>`),
  pinWipeYes: () => { try { [KEY, LOGO_KEY, 'raseed.pin'].forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); },
  back, closeModal: () => modal(''), closeModalBg: (d, el, ev) => { if (ev.target === el) modal(''); },
  tab: d => { ui.tab = +d.i; render(); window.scrollTo(0, 0); },
  cur: d => { ui.cur = +d.i; render(); },
  group: d => { ui.group = +d.i; render(); }, filter: d => { ui.filter = +d.i; render(); },
  openFilter: d => { ui.filter = +d.f; ui.group = 0; ui.tab = 1; render(); },
  openAccount: d => go('account', { id: d.id, side: d.side }),
  side: d => { ui.p = { ...ui.p, side: d.s }; render(); },
  newAccount: () => go('accountEdit', {}), editAccount: d => go('accountEdit', { id: d.id }),
  newEntry: () => go('entry', {}),
  addEntry: d => go('entry', { accountId: ui.p.id, side: d.side, kind: d.kind }),
  pay: d => go('entry', { accountId: d.id, side: 'SUPPLIER', kind: 'PAYMENT' }),
  wa: d => go('wa', { id: d.id, side: d.side, type: d.type }),
  waType: d => { ui.p = { ...ui.p, type: d.t }; render(); },
  waSent: () => { if ((ui.p.type || 'REMINDER') === 'REMINDER') { const a = D.accounts.find(x => x.id === ui.p.id); if (a) { a.lastReminded = todayISO(); save(); } } setTimeout(back, 400); },
  statement: d => {
    const a = D.accounts.find(x => x.id === ui.p.id); if (!a) return;
    const side = d.side || 'CUSTOMER';
    const text = d.withtext ? (document.getElementById('wa-text')?.value || '') : '';
    showPaper('كشف الحساب', statementPaper(a, side), 'كشف حساب ' + a.name, text);
  },
  generalPdf: () => showPaper('تقرير الذمم', reportPaper(), 'تقرير الذمم ' + todayISO(), ''),
  entryMenu: d => {
    const e = D.entries.find(x => x.id === d.id); if (!e) return; const a = D.accounts.find(x => x.id === e.accountId);
    modal(`<h2 class="num">${moneyC(e.amount, e.currency)}</h2><div class="muted">${esc(e.note || entryLabel(e))}<br>${fFull(e.date)}${e.due && e.kind === 'DEBT' ? '<br>يستحق: ' + fFull(e.due) : ''}</div>
      <button class="btn" data-act="editEntry" data-id="${e.id}">تعديل</button>
      ${a && e.side === 'CUSTOMER' && normPhone(a.phone) ? `<button class="btn wa" data-act="notifyEntry" data-id="${e.id}">إشعار العميل بالحركة</button>` : ''}
      <button class="btn danger" data-act="askDelEntry" data-id="${e.id}">حذف</button>`);
  },
  editEntry: d => { modal(''); go('entry', { entryId: d.id }); },
  notifyEntry: d => { modal(''); const e = D.entries.find(x => x.id === d.id); go('wa', { id: e.accountId, side: 'CUSTOMER', type: 'MOVEMENT', entryId: e.id }); },
  askDelEntry: d => modal(`<h2>حذف الحركة؟</h2><div class="muted">لا يمكن التراجع عن الحذف.</div><div class="grid2"><button class="btn out" data-act="closeModal">إلغاء</button><button class="btn" style="background:var(--red)" data-act="delEntry" data-id="${d.id}">حذف</button></div>`),
  delEntry: d => { D.entries = D.entries.filter(e => e.id !== d.id); save(); modal(''); render(); toast('حُذفت الحركة'); },
  delAccount: d => { const a = D.accounts.find(x => x.id === d.id); modal(`<h2>حذف الحساب؟</h2><div class="muted">سيُحذف "${esc(a?.name)}" وجميع حركاته نهائياً. يُنصح بأخذ نسخة احتياطية أولاً.</div><div class="grid2"><button class="btn out" data-act="closeModal">إلغاء</button><button class="btn" style="background:var(--red)" data-act="delAccountYes" data-id="${d.id}">حذف</button></div>`); },
  delAccountYes: d => { D.accounts = D.accounts.filter(a => a.id !== d.id); D.entries = D.entries.filter(e => e.accountId !== d.id); save(); modal(''); home(1); toast('حُذف الحساب'); },
  netting: () => {
    const a = D.accounts.find(x => x.id === ui.p.id), s = summarize(a, D.entries), cur = D.settings.currencies;
    const c = [0,1,2].find(i => s.cs.bal[i] > 0 && s.ss.bal[i] > 0) ?? 0;
    modal(`<form class="stack" data-form="netting"><h2>مقاصة بين الرصيدين</h2><div class="small muted">يُخصم المبلغ من رصيده كعميل ومن رصيده كمورد في الوقت نفسه.</div>
      ${radios('c', cur.map((x, i) => [String(i), `${esc(x.symbol)} (لك ${money(s.cs.bal[i])} · له ${money(s.ss.bal[i])})`]), String(c))}
      <label class="field">مبلغ المقاصة<input id="nt-amt" name="amount" inputmode="decimal" value="${Math.min(s.cs.bal[c], s.ss.bal[c]) > 0 ? plain(Math.min(s.cs.bal[c], s.ss.bal[c])) : ''}"></label>${dlgFoot('تنفيذ المقاصة')}</form>`);
  },
  dueQuick: d => { const f = document.getElementById('f-entry'); const date = f.querySelector('[name=date]').value || todayISO(); f.querySelector('[name=due]').value = +d.d ? addDays(date, +d.d) : ''; },
  dlgStore, dlgCur, dlgDefaults, dlgRemind, dlgTpl,
  licDialog: () => licDialog(),
  licRetry: () => { toast('جارٍ التحقق…'); Lic.sync(); },
  tplReset: () => { document.getElementById('tp-r').value = T_REM; document.getElementById('tp-s').value = T_ST; document.getElementById('tp-m').value = T_MV; },
  rmLogo: () => { LOGO = null; try { localStorage.removeItem(LOGO_KEY); } catch (e) {} render(); },
  backup: async () => {
    const file = new File([JSON.stringify(D, null, 2)], `raseed-backup-${todayISO()}.json`, { type: 'application/json' });
    const ok = await sharePdf(file, ''); if (!ok) toast('الحفظ غير متاح هنا. افتح التطبيق من رابطه المثبّت.');
  }
};

const F = {
  licRedeem: async (fd, f) => {
    const btn = f.querySelector('button:not([type=button])'), err = document.getElementById('lk-err');
    if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التفعيل…'; }
    const msg = await Lic.redeem(fd.get('code'));
    if (msg) { if (err) { err.hidden = false; err.textContent = msg; } if (btn) { btn.disabled = false; btn.textContent = 'تفعيل'; } return; }
    modal(''); render(); toast('تم تفعيل رصيد بنجاح');
  },
  licRegister: fd => {
    D.settings.cc = String(fd.get('cc') || '').replace(/\D/g, '') || D.settings.cc; D.store.phone = String(fd.get('phone') || '').trim(); save(); render(); Lic.sync();
  },
  onboard: fd => {
    D.store.name = String(fd.get('name')).trim(); D.store.phone = String(fd.get('phone') || '').trim();
    D.settings.cc = String(fd.get('cc') || '').replace(/\D/g, '') || '967'; save(); home(0); Lic.sync();
  },
  account: fd => {
    const ex = ui.p.id ? D.accounts.find(x => x.id === ui.p.id) : null, type = fd.get('type');
    const limits = {}; [0,1,2].forEach(c => { const v = parseMoney(fd.get('lim' + c)); if (v > 0) limits[c] = v; });
    const data = { name: String(fd.get('name')).trim(), phone: String(fd.get('phone') || '').trim(), type,
      limits: type === 'SUPPLIER' ? {} : limits, cTerm: +(fd.get('cTerm') ?? 30), sTerm: +(fd.get('sTerm') ?? 30),
      sRemind: Math.max(0, Math.min(60, parseInt(fd.get('sRemind')) || 3)), note: String(fd.get('note') || '').trim() };
    if (!data.name) return toast('اكتب اسم الحساب');
    if (ex) { Object.assign(ex, data); save(); back(); return; }
    const a = { id: uid(), lastReminded: null, createdAt: Date.now(), ...data };
    D.accounts.push(a);
    const ob = parseMoney(fd.get('ob'));
    if (ob > 0) { const side = type === 'CUSTOMER' ? 'CUSTOMER' : type === 'SUPPLIER' ? 'SUPPLIER' : (fd.get('obSide') || 'CUSTOMER');
      D.entries.push({ id: uid(), accountId: a.id, side, kind: 'DEBT', amount: ob, currency: +(fd.get('obCur') || 0), date: todayISO(), due: null, note: 'رصيد افتتاحي', createdAt: Date.now() }); }
    save(); ui.stack.pop(); ui.screen = 'home'; go('account', { id: a.id }); toast('حُفظ الحساب');
  },
  entry: fd => {
    const ex = ui.p.entryId ? D.entries.find(e => e.id === ui.p.entryId) : null;
    const accountId = ex ? ex.accountId : fd.get('accountId'); const a = D.accounts.find(x => x.id === accountId);
    if (!a) return toast('اختر الحساب');
    const amount = parseMoney(fd.get('amount')); if (!amount) return toast('اكتب مبلغاً صحيحاً');
    const side = a.type === 'CUSTOMER' ? 'CUSTOMER' : a.type === 'SUPPLIER' ? 'SUPPLIER' : (fd.get('side') || 'CUSTOMER');
    const kind = fd.get('kind') || 'DEBT', date = fd.get('date') || todayISO();
    const data = { accountId, side, kind, amount, currency: +(fd.get('currency') || 0), date, due: kind === 'DEBT' ? (fd.get('due') || null) : null, note: String(fd.get('note') || '').trim() };
    let id;
    if (ex) { Object.assign(ex, data); id = ex.id; } else { id = uid(); D.entries.push({ id, createdAt: Date.now(), ...data }); }
    save(); const notify = fd.get('notify'); back(); toast('حُفظت الحركة');
    if (notify && side === 'CUSTOMER') go('wa', { id: accountId, side: 'CUSTOMER', type: 'MOVEMENT', entryId: id });
  },
  store: fd => { D.store = { name: String(fd.get('name')).trim(), phone: String(fd.get('phone') || '').trim(), address: String(fd.get('address') || '').trim() }; save(); modal(''); render(); },
  cur: fd => { D.settings.currencies = [0,1,2].map(i => ({ name: String(fd.get('n' + i)).trim() || D.settings.currencies[i].name, symbol: String(fd.get('s' + i)).trim() || D.settings.currencies[i].symbol })); save(); modal(''); render(); },
  defaults: fd => { const s = D.settings; s.defaultLimit = parseMoney(fd.get('lim')) || 0; s.defaultTerm = Math.max(0, Math.min(365, parseInt(fd.get('term')) || 0)); s.cc = String(fd.get('cc')).replace(/\D/g, '') || s.cc; save(); modal(''); render(); },
  remind: fd => { const s = D.settings; s.remindBefore = Math.max(0, Math.min(60, parseInt(fd.get('before')) || 0)); s.remindOnDue = !!fd.get('onDue'); s.repeat = Math.max(0, Math.min(90, parseInt(fd.get('repeat')) || 0)); save(); modal(''); render(); },
  tpl: fd => { const s = D.settings; s.tReminder = fd.get('r') || T_REM; s.tStatement = fd.get('s') || T_ST; s.tMovement = fd.get('m') || T_MV; save(); modal(''); render(); },
  netting: fd => {
    const c = +(fd.get('c') || 0), amt = parseMoney(fd.get('amount')), a = D.accounts.find(x => x.id === ui.p.id), s = summarize(a, D.entries);
    if (!amt || amt > Math.min(s.cs.bal[c], s.ss.bal[c])) return toast('المبلغ أكبر من أصغر الرصيدين');
    const note = 'مقاصة بين حساب العميل وحساب المورد', t = todayISO();
    D.entries.push({ id: uid(), accountId: a.id, side: 'CUSTOMER', kind: 'PAYMENT', amount: amt, currency: c, date: t, due: null, note, createdAt: Date.now() },
      { id: uid(), accountId: a.id, side: 'SUPPLIER', kind: 'PAYMENT', amount: amt, currency: c, date: t, due: null, note, createdAt: Date.now() + 1 });
    save(); modal(''); render(); toast('نُفّذت المقاصة');
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act !== 'waSent') ev.preventDefault();
  if (el.dataset.act !== 'closeModalBg' && el.closest('[data-act="openAccount"]') && el !== el.closest('[data-act="openAccount"]')) ev.stopPropagation();
  fn(el.dataset, el, ev);
});
document.addEventListener('submit', ev => { const f = ev.target; if (!f.dataset.form) return; ev.preventDefault(); F[f.dataset.form](new FormData(f), f); });
document.addEventListener('input', ev => {
  const el = ev.target, live = el.dataset.live;
  if (live === 'search') { ui.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('acc-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
  else if (live === 'waText') { const go_ = document.getElementById('wa-go'); const a = D.accounts.find(x => x.id === ui.p.id); if (go_ && a) go_.href = waLink(normPhone(a.phone), el.value); const sm = document.getElementById('sms-go'); if (sm && a) sm.href = smsLink(normPhone(a.phone), el.value); }
  else if (ui.screen === 'entry') updateLimitWarn();
});
document.addEventListener('change', ev => {
  const el = ev.target, live = el.dataset.live;
  if (live === 'entryAcc') { const a = D.accounts.find(x => x.id === el.value); ui.p = { ...ui.p, accountId: el.value || undefined, side: a && a.type === 'SUPPLIER' ? 'SUPPLIER' : 'CUSTOMER' }; render(); }
  else if (live === 'dueFromDate') { /* keep the chosen due date */ updateLimitWarn(); }
  else if (live === 'logo' && el.files[0]) {
    const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
      const m = 360, sc = Math.min(1, m / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); LOGO = cv.toDataURL('image/png'); try { localStorage.setItem(LOGO_KEY, LOGO); } catch (e) { toast('الشعار كبير جداً'); } render(); };
      img.src = r.result; }; r.readAsDataURL(el.files[0]);
  }
  else if (live === 'restore' && el.files[0]) {
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (d.app !== 'raseed') throw 0; D = normalize(d); save(); home(0); toast('تمت استعادة البيانات'); } catch (e) { toast('الملف غير صالح'); } };
    r.readAsText(el.files[0]);
  }
  else if (ui.screen === 'entry') {
    if (el.name === 'kind' || el.name === 'side') { // relabel kind buttons / colours when side changes
      const f = document.getElementById('f-entry'); const fd = new FormData(f);
      if (el.name === 'side') { ui.p = { ...ui.p, side: el.value, kind: fd.get('kind'), _keep: Object.fromEntries(fd) }; render(); restoreForm(); return; }
      const segs = el.closest('.segs'); segs.classList.toggle('red', fd.get('side') === 'CUSTOMER' && el.value === 'DEBT');
    }
    updateLimitWarn();
  }
});
function restoreForm() {
  const keep = ui.p._keep; if (!keep) return; const f = document.getElementById('f-entry'); if (!f) return;
  ['amount', 'date', 'due', 'note'].forEach(k => { const i = f.querySelector(`[name=${k}]`); if (i && keep[k] != null) i.value = keep[k]; });
  const c = f.querySelector(`[name=currency][value="${keep.currency}"]`); if (c) c.checked = true;
  updateLimitWarn();
}

// ================= boot =================
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
render();
setTimeout(() => { ui.screen = D.store.name ? 'home' : 'onboard'; render(); }, 1500);
Lic.sync();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { PinLock.onHide(); return; }
  PinLock.onShow(); render(); Lic.sync();
});
})();
